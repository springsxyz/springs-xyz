<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Springs XYZ creates thoughtful apps that make everyday life a little better."
    />
    <meta name="theme-color" content="#faf9f6" />
    <link rel="canonical" href="https://springsxyz.com/" />
    <meta property="og:title" content="Springs XYZ — Thoughtful apps for everyday life" />
    <meta
      property="og:description"
      content="Apps that make everyday life a little better."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://springsxyz.com/" />
    <title>Springs XYZ — Apps that make everyday life a little better</title>
    <link rel="stylesheet" href="./styles.css?v=12" />
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="wordmark" href="./" aria-label="Springs XYZ home">
          <img
            class="spring-mark"
            src="./assets/springs-wave-reference.png?v=1"
            alt=""
            width="60"
            height="62"
          />
          <span>Springs XYZ</span>
        </a>

        <p class="catalog-id">Studio catalog <span>02</span></p>

        <a class="contact-link" href="mailto:springsxyz.com@gmail.com">
          Contact <span aria-hidden="true">→</span>
        </a>
      </header>

      <main>
        <section class="catalog" aria-label="Apps by Springs XYZ">
          <a
            class="app-tile"
            id="keep-at-it"
            href="https://keepatit.app"
            target="_blank"
            rel="noreferrer"
            aria-label="Open Keep At It — Full-body strength for real life"
          >
            <span class="app-icon image-icon" aria-hidden="true">
              <img src="./assets/keep-at-it-icon.png?v=1" alt="" width="512" height="512" />
            </span>
            <span class="app-label">Keep At It <span aria-hidden="true">↗</span></span>
          </a>
        </section>
      </main>

      <footer class="site-footer">
        <p class="copyright">© <span id="year">2026</span> Springs XYZ</p>
        <p class="footer-line"><strong>Thoughtful apps.</strong> <em>Made to keep.</em></p>
      </footer>
    </div>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
